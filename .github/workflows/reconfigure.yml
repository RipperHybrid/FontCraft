name: Build & Release

on:
  push:
    branches:
      - Master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        continue-on-error: true
        env:
          TARGET_REPO: "gitlab.com/RipperHybrid/FontCraft.git"
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@${{ env.TARGET_REPO }}
          git push gitlab HEAD:${{ github.ref_name }} --force
          git push gitlab --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Production WebUI
        run: |
          cd webroot
          npm install
          npm run build
          cp -r cgi-bin dist/
          cd ..

      - name: Generate template.zip
        run: |
          mkdir -p Template_Build
          cp -r binaries META-INF action.sh module.prop monitor.sh service.sh utils.sh uninstall.sh Template_Build/
          cp -r webroot/dist Template_Build/webroot
          cd Template_Build
          zip -r ../template.zip .
          cd ..
          mkdir -p Template
          mv template.zip Template/

      - name: Prepare Master Folder
        run: |
          mkdir -p Master_Staging
          cp -r binaries META-INF Template action.sh customize.sh utils.sh monitor.sh module.prop service.sh uninstall.sh Master_Staging/
          cp -r webroot/dist Master_Staging/webroot

      - name: Extract Metadata from module.prop
        id: metadata
        run: |
          RAW_VERSION=$(grep -oP '^version=\K.*' module.prop | tr -d '\r')
          VERSION=${RAW_VERSION#v}
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=FontCraftPro_V${VERSION}_By_RipperHybrid.zip" >> $GITHUB_OUTPUT
          if [ -f "changelog.md" ]; then
            echo "body_file=changelog.md" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "$COMMIT_MSG" > release_msg.txt
            echo "body_file=release_msg.txt" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Zip
        run: |
          cd Master_Staging
          zip -r ../${{ steps.metadata.outputs.filename }} .
          cd ..

      - name: Check for Edit and Append Footer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.metadata.outputs.tag }}"
          BODY_FILE="${{ steps.metadata.outputs.body_file }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            NOW_DATE=$(date +'%Y-%m-%d')
            NOW_TIME=$(date +'%H:%M:%S')
            echo "" >> "$BODY_FILE"
            echo "- Edited: Date: $NOW_DATE Time: $NOW_TIME" >> "$BODY_FILE"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: FontCraft Pro Module - Version ${{ steps.metadata.outputs.version }} Changelog
          body_path: ${{ steps.metadata.outputs.body_file }}
          files: ${{ steps.metadata.outputs.filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to Telegram
        continue-on-error: true
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOTAPI }}
          CHAT_ID: ${{ secrets.CHANNEL }}
          ZIP_NAME: ${{ steps.metadata.outputs.filename }}
          REPO_SLUG: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_HASH: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            exit 0
          fi
          if [ ! -f "$ZIP_NAME" ]; then
            exit 1
          fi
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          if [ -n "$COMMIT_BODY" ]; then
            RAW_CAPTION=$(printf '%s\n\n%s' "$COMMIT_SUBJECT" "$COMMIT_BODY")
          else
            RAW_CAPTION="$COMMIT_SUBJECT"
          fi
          if [ ${#RAW_CAPTION} -ge 1024 ]; then
            RAW_CAPTION=$(printf '%s\n\n%s' "${RAW_CAPTION:0:950}" "... (truncated due to Telegram limit)")
          fi
          printf '%s' "$RAW_CAPTION" > /tmp/tg_caption.txt
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            BTN_TEXT="Manual Run ⚡️"
            BTN_URL="${SERVER_URL}/${REPO_SLUG}/actions/runs/${RUN_ID}"
          else
            BTN_TEXT="View Changelog 📋"
            BTN_URL="${SERVER_URL}/${REPO_SLUG}/commit/${COMMIT_HASH}"
          fi
          REPO_URL="${SERVER_URL}/${REPO_SLUG}"
          KEYBOARD_JSON="{\"inline_keyboard\":[[{\"text\":\"$BTN_TEXT\",\"url\":\"$BTN_URL\"},{\"text\":\"Repo 🏠\",\"url\":\"$REPO_URL\"}]]}"
          curl -s \
               -F "chat_id=$CHAT_ID" \
               -F "document=@$ZIP_NAME" \
               -F "caption=</tmp/tg_caption.txt" \
               -F "reply_markup=$KEYBOARD_JSON" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"